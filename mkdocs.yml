# Documentation site (MkDocs + Material), published on GitHub Pages next to
# the web map: https://robertotjesse.github.io/3-30-300-regel/docs/
#   pip install -r docs/requirements.txt
#   mkdocs serve                       # preview at http://127.0.0.1:8000
#   mkdocs build -d <gh-pages>/docs    # publish: into the gh-pages branch
site_name: 3-30-300-regel
site_description: The 3-30-300 rule per home, buurt, wijk and gemeente in Zuid-Holland
site_url: https://robertotjesse.github.io/3-30-300-regel/docs/
repo_url: https://github.com/RobertoTjesse/3-30-300-regel
repo_name: RobertoTjesse/3-30-300-regel
edit_uri: edit/master/docs/
docs_dir: docs
exclude_docs: |
  requirements.txt

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Use it:
      - Getting started: getting-started.md
      - Another province: another-province.md
      - Web map and publishing: web-map.md
  - The indicators:
      - "The 3: visible trees": the-3.md
      - "The 30: canopy cover": the-30.md
      - "The 300: green within walking distance": the-300.md
  - Background:
      - Data sources: data-sources.md
      - Validation against ArcGIS: validation-arcgis.md
      - QGIS validation project: qgis-validation.md
      - Benchmarks and hardware: benchmarks.md
      - "Speed test: ArcGIS against GDAL": speedtest.md
      - Known issues: known-issues.md

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences

extra:
  social:
    - icon: material/map
      link: https://robertotjesse.github.io/3-30-300-regel/
      name: The web map
